# Local PostgreSQL for development. Prod uses Neon.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: eatandcalc
      POSTGRES_PASSWORD: eatandcalc
      POSTGRES_DB: eatandcalc
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eatandcalc"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
