<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Быстрый ввод количества продукта</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2E7D4F}a:hover{color:#1F5E3A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #8E8A80; font-family: Inter, system-ui, sans-serif; color: #1D1C19; font-variant-numeric: tabular-nums">
  <div aria-hidden="true" style="position: absolute; left: 20px; top: 24px; color: #F6F4EF; font-family: Manrope, Inter, sans-serif; font-size: 20px; font-weight: 800; opacity: 0.6">Курица с овощами</div>

  <section aria-label="Добавить продукт" style="position: absolute; left: 0; right: 0; top: 72px; bottom: 0; background: #F6F4EF; border-radius: 24px 24px 0 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 40px; height: 5px; border-radius: 999px; background: #D5D0C4"></span></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px 0 20px">
      <h1 style="flex: 1; margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 20px; font-weight: 800">Добавить продукт</h1>
      <a href="CookingEdit.dc.html" aria-label="Закрыть" style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #1D1C19"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 10px">
      <label style="height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6E2D8; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: #67635A">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input type="search" aria-label="Поиск продукта" placeholder="Найти продукт" style="flex: 1; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #1D1C19">
      </label>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <span style="font-size: 12px; color: #67635A; width: 100%">Часто используете</span>
        <button aria-pressed="true" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 0; background: #1D1C19; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">Оливковое масло</button>
        <button style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #E6E2D8; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 500; color: #1D1C19">Лук репчатый</button>
        <button style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #E6E2D8; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 500; color: #1D1C19">Яйцо</button>
        <button style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #E6E2D8; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 500; color: #1D1C19">Сметана 15%</button>
      </div>
    </div>

    <div style="margin: 14px 20px 0; background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="flex: 1">
          <div style="font-size: 15px; font-weight: 600">Оливковое масло</div>
          <div style="font-size: 12px; color: #67635A">899 ккал / 100 г · 1 ст. л. = 13,5 г</div>
        </div>
      </div>
      <div role="radiogroup" aria-label="Единица" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 12px; background: #EDEAE2">
        <sc-for list="{{units}}" as="u" hint-placeholder-count="3">
          <button role="radio" aria-checked="{{u.checked}}" onClick="{{u.pick}}" style="height: 34px; border: 0; border-radius: 9px; font-family: inherit; font-size: 13px; font-weight: 600; color: #1D1C19; background: {{u.bg}}">{{u.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px">
        <output aria-live="polite" style="font-family: Manrope, Inter, sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -0.5px">{{display}}</output>
        <span style="font-size: 16px; color: #67635A">{{unitShort}}</span>
        <span style="flex: 1"></span>
        <span style="font-size: 13px; color: #67635A">{{grams}}</span>
      </div>
      <div style="display: flex; gap: 14px; font-size: 13px; padding-top: 2px">
        <span style="font-weight: 700">{{kcal}} ккал</span>
        <span style="color: #4A4740">Б {{p}}</span>
        <span style="color: #4A4740">Ж {{f}}</span>
        <span style="color: #4A4740">У {{c}}</span>
      </div>
    </div>

    <div style="padding: 12px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
        <button onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 46px; border: 0; border-radius: 12px; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 20px; font-weight: 600; color: #1D1C19; box-shadow: 0 1px 0 #D5D0C4">{{k.label}}</button>
      </sc-for>
    </div>

    <div style="margin-top: auto; padding: 12px 20px 28px">
      <a href="CookingEdit.dc.html" style="height: 52px; border-radius: 16px; background: #2E7D4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 600">Добавить в готовку</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { unit: 'tbsp', val: '2' }; }
  renderVals() {
    var self = this;
    var U = { g: { label: 'граммы', short: 'г', g: 1 }, tbsp: { label: 'ст. ложки', short: 'ст. л.', g: 13.5 }, tsp: { label: 'ч. ложки', short: 'ч. л.', g: 4.5 } };
    var u = U[this.state.unit];
    var num = parseFloat(this.state.val.replace(',', '.')) || 0;
    var grams = num * u.g;
    function one(x) { return (Math.round(x * 10) / 10).toFixed(1).replace('.', ','); }
    function press(ch) {
      return function () {
        var v = self.state.val;
        if (ch === 'del') v = v.length > 1 ? v.slice(0, -1) : '0';
        else if (ch === ',') { if (v.indexOf(',') < 0) v = v + ','; }
        else v = (v === '0' ? '' : v) + ch;
        if (v.length > 6) return;
        self.setState({ val: v });
      };
    }
    var labels = ['1','2','3','4','5','6','7','8','9',',','0','del'];
    return {
      units: ['g', 'tbsp', 'tsp'].map(function (id) {
        var on = self.state.unit === id;
        return { label: U[id].label, checked: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent',
          pick: function () { self.setState({ unit: id, val: id === 'g' ? '30' : '1' }); } };
      }),
      display: this.state.val, unitShort: u.short,
      grams: this.state.unit === 'g' ? '' : '= ' + one(grams) + ' г',
      kcal: Math.round(grams * 8.99), p: '0,0', f: one(grams * 0.999), c: '0,0',
      keys: labels.map(function (l) { return { label: l === 'del' ? '⌫' : l, aria: l === 'del' ? 'Стереть' : l === ',' ? 'Запятая' : l, press: press(l) }; })
    };
  }
}
</script>
</body>
</html>
