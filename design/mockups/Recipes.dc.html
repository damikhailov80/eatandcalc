<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Рецепты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2E7D4F}a:hover{color:#1F5E3A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1120px; overflow: hidden; background: #F6F4EF; font-family: Inter, system-ui, sans-serif; color: #1D1C19; font-variant-numeric: tabular-nums">

<header style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; gap: 10px">
    <h1 style="flex: 1; margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.4px">Рецепты</h1>
    <a href="RecipeEdit.dc.html" style="height: 44px; padding: 0 16px; border-radius: 14px; background: #2E7D4F; color: #FFFFFF; display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Новый</a>
  </div>
  <label style="height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6E2D8; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: #67635A">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <input type="search" aria-label="Поиск рецептов" placeholder="Название или продукт" style="flex: 1; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #1D1C19">
  </label>
  <div style="display: flex; gap: 6px">
    <button aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: #1D1C19; font-family: inherit; font-size: 13px; font-weight: 600; color: #FFFFFF">Часто готовим</button>
    <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E6E2D8; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 500; color: #1D1C19">А–Я</button>
    <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E6E2D8; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 500; color: #1D1C19">Новые</button>
  </div>
</header>

<main style="padding: 14px 20px 110px; display: flex; flex-direction: column; gap: 10px">
  <sc-for list="{{recipes}}" as="r" hint-placeholder-count="6">
    <article style="position: relative; background: #FFFFFF; border-radius: 18px; padding: 14px 6px 14px 16px; display: flex; gap: 6px; box-shadow: 0 1px 2px rgba(29,28,25,0.05)">
      <a href="RecipeEdit.dc.html" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #1D1C19">
        <div style="display: flex; align-items: baseline; gap: 8px">
          <span style="flex: 1; font-size: 16px; font-weight: 600">{{r.name}}</span>
          <span style="font-size: 15px; font-weight: 700">{{r.kcal}}</span>
        </div>
        <div style="font-size: 12px; color: #67635A; line-height: 1.4">{{r.ingr}}</div>
        <div style="display: flex; height: 6px; border-radius: 999px; overflow: hidden; gap: 2px">
          <div style="width: {{r.pW}}; background: #3566B0"></div>
          <div style="width: {{r.fW}}; background: #B7791F"></div>
          <div style="width: {{r.cW}}; background: #7A5AB0"></div>
        </div>
        <div style="display: flex; gap: 10px; font-size: 12px; color: #4A4740">
          <span style="flex: 1">{{r.meta}}</span>
          <span>{{r.bju}}</span>
        </div>
      </a>
      <button aria-label="{{r.menuLabel}}" aria-expanded="{{r.open}}" style="width: 40px; height: 40px; margin-top: -6px; border: 0; border-radius: 12px; background: {{r.menuBg}}; color: #1D1C19; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
      <sc-if value="{{r.showMenu}}" hint-placeholder-val="{{false}}">
        <div role="menu" style="position: absolute; right: 8px; top: 44px; z-index: 2; width: 210px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 8px 28px rgba(29,28,25,0.18); padding: 6px; display: flex; flex-direction: column">
          <a role="menuitem" href="CookingEdit.dc.html" style="height: 44px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1D1C19; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"></path><path d="M2 10h20M9 6.5c0-1.2 1.2-2.5 3-2.5s3 1.3 3 2.5"></path></svg>Приготовить сегодня</a>
          <a role="menuitem" href="RecipeEdit.dc.html" style="height: 44px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1D1C19; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Редактировать</a>
          <button role="menuitem" style="height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; gap: 10px; color: #1D1C19; font-family: inherit; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>Создать копию</button>
          <div style="height: 1px; background: #EFECE4; margin: 4px 6px"></div>
          <button role="menuitem" style="height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; gap: 10px; color: #B4320A; font-family: inherit; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"></path></svg>Удалить</button>
        </div>
      </sc-if>
    </article>
  </sc-for>
</main>

<nav aria-label="Разделы" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 6px 24px; background: #FFFFFF; border-top: 1px solid #E6E2D8; display: flex">
  <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #67635A; font-size: 11px; font-weight: 500"><span style="display: flex; padding: 3px 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>День</a>
  <a href="CookingHistory.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #67635A; font-size: 11px; font-weight: 500"><span style="display: flex; padding: 3px 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"></path><path d="M2 10h20M9 6.5c0-1.2 1.2-2.5 3-2.5s3 1.3 3 2.5"></path></svg></span>Готовка</a>
  <a href="Recipes.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #1F5E3A; font-size: 11px; font-weight: 700"><span style="display: flex; padding: 3px 16px; border-radius: 999px; background: #E3F0E7"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h10a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3V4a1 1 0 0 1 1-1z"></path><path d="M9 8h6M9 12h6M9 16h3"></path></svg></span>Рецепты</a>
  <a href="Products.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #67635A; font-size: 11px; font-weight: 500"><span style="display: flex; padding: 3px 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7.5c-3-2-8-1-8 4.5 0 5 3 9 5 9 1 0 2-.5 3-.5s2 .5 3 .5c2 0 5-4 5-9 0-5.5-5-6.5-8-4.5z"></path><path d="M12 7.5c0-2 1-3.8 3-4.5"></path></svg></span>Продукты</a>
  <a href="Family.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #67635A; font-size: 11px; font-weight: 500"><span style="display: flex; padding: 3px 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.5-3.5 3.2-6 6.5-6s6 2.5 6.5 6"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M17 14c2.5 0 4.3 2 4.6 5"></path></svg></span>Семья</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    function one(x) { return (Math.round(x * 10) / 10).toFixed(1).replace('.', ','); }
    function r(name, ingr, meta, kcal, p, f, c, open) {
      var e = p * 4 + f * 9 + c * 4;
      return {
        name: name, ingr: ingr, meta: meta, kcal: kcal + ' ккал',
        bju: 'Б ' + one(p) + ' · Ж ' + one(f) + ' · У ' + one(c),
        pW: (p * 4 / e * 100).toFixed(1) + '%', fW: (f * 9 / e * 100).toFixed(1) + '%', cW: (c * 4 / e * 100).toFixed(1) + '%',
        showMenu: !!open, open: open ? 'true' : 'false', menuBg: open ? '#EDEAE2' : 'transparent',
        menuLabel: 'Действия с рецептом ' + name
      };
    }
    return {
      recipes: [
        r('Курица с овощами', 'Куриная грудка 150 г, брокколи 100 г, морковь 50 г, оливковое масло 10 г', '310 г · 1 порция', 309, 37.9, 12.3, 11.4, true),
        r('Сырники', 'Творог 5% 400 г, яйцо 2 шт, мука 60 г, сахар 2 ст. л., подсолнечное масло 2 ст. л.', '600 г · 4 порции', 315, 22.3, 16.7, 18.5),
        r('Гречка отварная', 'Гречка 300 г, оливковое масло 10 г', '900 г · 4 порции', 257, 9.5, 5.0, 46.6),
        r('Овсяная каша на молоке', 'Овсяные хлопья 160 г, молоко 2,5% 600 г, сахар 2 ч. л.', '900 г · 4 порции', 229, 9.1, 6.2, 33.3),
        r('Куриный суп с лапшой', 'Куриное бедро 600 г, лапша 150 г, картофель 400 г, морковь, лук, вода', '3 200 г · 8 порций', 192, 14.0, 7.2, 18.0),
        r('Картофельное пюре', 'Картофель 700 г, молоко 2,5% 150 мл, сливочное масло 20 г', '750 г · 3 порции', 245, 5.3, 9.0, 36.0)
      ]
    };
  }
}
</script>
</body>
</html>
